name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check public repository boundary
        run: python tools/check_public_boundary.py
      - name: Check source/static consistency
        run: python tools/check_source_consistency.py
      - name: Check full lessons and inline quizzes
        run: python tools/check_topic_learning_paths.py
      - name: Check Mermaid sources
        run: python tools/check_mermaid_sources.py
      - name: Check answer-length bias in test bank
        run: python tools/check_quiz_bias.py docs/assets/javascripts/test-bank.js
      - name: Build site
        run: mkdocs build --strict
      - name: Check generated site links
        run: python tools/check_site_links.py site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
