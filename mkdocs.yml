site_name: IDPS Course
site_description: "Интерактивный курс по системам обнаружения и предотвращения вторжений"
site_author: "Кафедра информационной безопасности"

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/course.js

nav:
  - Главная: index.md
  - Основы IDPS:
      - Введение: course/01-intro.md
      - Классификация IDPS: course/02-classification.md
      - Как работает обнаружение: course/03-detection.md
      - Firewall и IDPS: course/04-firewall-vs-idps.md
      - Качество детектирования: course/05-detection-quality.md
      - Размещение сенсоров: course/06-placement.md
  - Проверка знаний:
      - Pre-Lab Test №1: prelab/index.md
  - Лабораторные работы:
      - ЛР №1 — Основы Suricata: labs/lab01/index.md
  - Материалы:
      - Источники курса: resources/sources.md
      - Глоссарий: resources/glossary.md
      - Troubleshooting: resources/troubleshooting.md
