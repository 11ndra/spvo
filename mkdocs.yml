site_name: IDPS Course
site_description: "Интерактивный курс по системам обнаружения и предотвращения вторжений"
site_author: "Кафедра информационной безопасности"
site_url: "https://11ndra.github.io/spvo/"
use_directory_urls: true

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/idps-system.css
  - assets/stylesheets/quiz.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js
  - assets/javascripts/course.js
  - assets/javascripts/idps-system.js
  - assets/javascripts/test-bank.js

nav:
  - Теория:
      - Начало курса: index.md
      - Темы дисциплины: syllabus/index.md
      - "Модуль 1 — Основы и угрозы":
          - "01 — Введение в кибербезопасность": topics/01-cybersecurity-threats.md
          - "02 — Принципы работы IDS": topics/02-ids-principles.md
          - "03 — Сервисы кибербезопасности": topics/03-security-services.md
          - "04 — Уязвимости, риски и атаки": topics/04-vulnerabilities-risks-attacks.md
          - "05 — Киберпреступность": topics/05-cybercrime.md
          - "06 — Аномальная активность и вредоносное ПО": topics/06-anomaly-malware.md
          - "07 — Формы интернет-преступности": topics/07-internet-crime.md
          - "08 — Принципы работы IPS": topics/08-ips-principles.md
      - "Модуль 2 — Протоколы, приложения и защита":
          - "09 — Модель OSI": topics/09-osi.md
          - "10 — Шифрование данных": topics/10-crypto.md
          - "11 — Безопасность сетевых протоколов": topics/11-network-protocol-security.md
          - "12 — Безопасность приложений": topics/12-application-security.md
          - "13 — Безопасность веб-сервисов": topics/13-web-services-security.md
          - "14 — Антивирусная и проактивная защита": topics/14-antivirus-proactive.md
          - "15 — Подготовка специалиста": topics/15-professional-preparation.md
      - Подробные материалы:
          - "IDS/IPS: назначение, обнаружение и предотвращение": course/01-intro.md
          - "Угрозы, уязвимости, риск и киберпреступность": course/01a-threat-context.md
          - "Виды IDS/IPS и источники наблюдения": course/02-classification.md
          - "Архитектура IDS/IPS: компоненты и путь данных": course/03-detection.md
          - "Размещение IDS/IPS и точки наблюдения": course/04-detection-methods.md
          - "Методы обнаружения подозрительной активности": course/05-firewall-vs-idps.md
          - "Правила IDS/IPS и detection logic": course/06-rules.md
          - "Ограничения IDS/IPS, слепые зоны и ошибки": course/07-limitations.md
          - "Оценка эффективности IDS/IPS и предотвращения": course/08-effectiveness.md
          - "Архитектура, интеграция и современный контекст": course/08a-integration-context.md
          - "Протоколы и зашифрованный трафик": course/09-protocol-visibility.md
          - "Безопасность приложений и веб-сервисов": course/09a-application-web-security.md
          - "Антивирус, HIDS/HIPS и EDR": course/09b-endpoint-protection.md
          - "Профессиональная практика специалиста": course/09c-professional-practice.md
