site_name: IDPS Course
site_description: "Интерактивный курс по системам обнаружения и предотвращения вторжений"
site_author: "Кафедра информационной безопасности"
site_url: "https://11ndra.github.io/spvo/"
use_directory_urls: true

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/idps-system.css
  - assets/stylesheets/quiz.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js
  - assets/javascripts/course.js
  - assets/javascripts/idps-system.js
  - assets/javascripts/test-bank.js

nav:
  - Курс IDS/IPS:
      - Начало курса: index.md
      - Основы IDPS:
          - "01 — Что такое IDS/IPS и зачем они нужны": course/01-intro.md
          - "Контекст — Угрозы, уязвимости, риск и киберпреступность": course/01a-threat-context.md
          - "02 — Какие виды IDS/IPS существуют": course/02-classification.md
          - "03 — Из чего состоит IDS/IPS и как она работает": course/03-detection.md
          - "04 — Где и как размещают IDS/IPS": course/04-detection-methods.md
          - "05 — Как IDS/IPS обнаруживает подозрительную активность": course/05-firewall-vs-idps.md
          - "06 — Что такое правила и как они устроены": course/06-rules.md
          - "07 — Почему IDS/IPS ошибается и чего она не видит": course/07-limitations.md
          - "08 — Как проверить и обосновать эффективность IDS/IPS": course/08-effectiveness.md
          - "Контекст — Архитектура, интеграция и современный контекст": course/08a-integration-context.md
      - Эксплуатация и современные IDPS:
          - "09 — Протоколы, приложения и зашифрованный трафик глазами IDPS": course/09-protocol-visibility.md
          - "Контекст — Прикладная и веб-безопасность глазами IDPS": course/09a-application-web-security.md
          - "Контекст — Защита конечных систем: антивирус, HIDS/HIPS и EDR": course/09b-endpoint-protection.md
          - "Контекст — Профессиональная практика специалиста": course/09c-professional-practice.md
          - "10 — Как поддерживать возможности обнаружения": course/10-operations-lifecycle.md
          - "11 — Как сопоставлять несколько источников и контекст угроз": course/11-multi-source-correlation.md
  - Программа дисциплины:
      - 15 тем силлабуса: syllabus/index.md
      - Темы 01–08:
          - "01 — Введение в кибербезопасность": topics/01-cybersecurity-threats.md
          - "02 — Принципы работы IDS": topics/02-ids-principles.md
          - "03 — Сервисы кибербезопасности": topics/03-security-services.md
          - "04 — Уязвимости, риски и атаки": topics/04-vulnerabilities-risks-attacks.md
          - "05 — Киберпреступность": topics/05-cybercrime.md
          - "06 — Аномальная активность и вредоносное ПО": topics/06-anomaly-malware.md
          - "07 — Формы интернет-преступности": topics/07-internet-crime.md
          - "08 — Принципы работы IPS": topics/08-ips-principles.md
      - Темы 09–15:
          - "09 — Модель OSI": topics/09-osi.md
          - "10 — Шифрование данных": topics/10-crypto.md
          - "11 — Безопасность сетевых протоколов": topics/11-network-protocol-security.md
          - "12 — Безопасность приложений": topics/12-application-security.md
          - "13 — Безопасность веб-сервисов": topics/13-web-services-security.md
          - "14 — Антивирусная и проактивная защита": topics/14-antivirus-proactive.md
          - "15 — Подготовка специалиста": topics/15-professional-preparation.md
  - Практика:
      - "00 — Подготовка лабораторной среды": labs/environment/index.md
      - "Практикум 0 — Знакомство с рабочей IDPS": labs/orientation/index.md
      - "Этичное тестирование и scope": labs/pentest-foundations/index.md
      - "ЛР №1 — Первое сетевое обнаружение": labs/lab01/index.md
      - "ЛР №2 — Один эпизод, два источника данных": labs/lab02/index.md
      - "ЛР №3 — Точка наблюдения": labs/lab03/index.md
      - "ЛР №4 — Разные основания аналитического решения": labs/lab04/index.md
      - "ЛР №5 — Изменяем условие правила": labs/lab05/index.md
  - Самопроверка:
      - "90 контрольных вопросов": resources/exam-prep.md
      - "Тестовый тренажёр": resources/test-bank.md
  - СРО:
      - "Самостоятельная работа": resources/sro-plan.md
      - "Итоговый проект": resources/project-brief.md
  - Справочник:
      - "Источники курса": resources/sources.md
      - "Глоссарий": resources/glossary.md
      - "Диагностика проблем": resources/troubleshooting.md
