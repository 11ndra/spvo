site_name: IDPS Course
site_description: "Интерактивный курс по системам обнаружения и предотвращения вторжений"
site_author: "Кафедра информационной безопасности"

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/course.js

nav:
  - Курс:
      - Обзор курса: index.md
      - Основы IDPS:
          - "01 — Зачем нужны IDS/IPS": course/01-intro.md
          - "02 — Что система может видеть": course/02-classification.md
          - "03 — Как из данных получается обнаружение": course/03-detection.md
          - "04 — Firewall и IDPS": course/04-firewall-vs-idps.md
          - "05 — Качество детектирования": course/05-detection-quality.md
          - "06 — Размещение сенсоров": course/06-placement.md
  - Проверка знаний:
      - Pre-Lab Test №1: prelab/index.md
  - Лабораторные работы:
      - ЛР №1 — Основы Suricata: labs/lab01/index.md
  - Материалы:
      - Источники курса: resources/sources.md
      - Глоссарий: resources/glossary.md
      - Визуальные элементы: resources/visual-guide.md
      - Troubleshooting: resources/troubleshooting.md
