site_name: IDPS Course
site_description: "Интерактивный курс по системам обнаружения и предотвращения вторжений"
site_author: "Кафедра информационной безопасности"
site_url: "https://11ndra.github.io/spvo/"
use_directory_urls: true

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/idps-system.css
extra_javascript:
  - assets/javascripts/course.js
  - assets/javascripts/idps-system.js

nav:
  - Курс:
      - Обзор курса: index.md
      - Основы IDPS:
          - "01 — Что такое IDS/IPS и зачем они нужны": course/01-intro.md
          - "02 — Какие виды IDS/IPS существуют": course/02-classification.md
          - "03 — Из чего состоит IDS/IPS и как она работает": course/03-detection.md
          - "04 — Где и как размещают IDS/IPS": course/04-detection-methods.md
          - "05 — Как IDS/IPS обнаруживает подозрительную активность": course/05-firewall-vs-idps.md
          - "06 — Что такое правила и как они устроены": course/06-rules.md
  - Лабораторные работы:
      - "00 — Подготовка лабораторной среды": labs/environment/index.md
      - "Практикум 0 — Знакомство с рабочей IDPS": labs/orientation/index.md
      - "ЛР №1 — Первое сетевое обнаружение": labs/lab01/index.md
      - "ЛР №2 — Один эпизод, два источника данных": labs/lab02/index.md
      - "ЛР №3 — Точка наблюдения": labs/lab03/index.md
      - "ЛР №4 — Четыре основания решения": labs/lab04/index.md
      - "ЛР №5 — Изменяем условие правила": labs/lab05/index.md
  - Материалы:
      - Источники курса: resources/sources.md
      - Глоссарий: resources/glossary.md
      - Диагностика проблем: resources/troubleshooting.md
