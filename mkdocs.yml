site_name: IDPS Course
site_description: "Интерактивный курс по системам обнаружения и предотвращения вторжений"
site_author: "Кафедра информационной безопасности"

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/course.js

nav:
  - Курс:
      - Обзор курса: index.md
      - Основы IDPS:
          - "01 — Что такое IDS/IPS и зачем они нужны": course/01-intro.md
          - "02 — Какие виды IDS/IPS существуют": course/02-classification.md
          - "03 — Из чего состоит IDS/IPS и как она работает": course/03-detection.md
          - "04 — Где и как размещают IDS/IPS": course/04-detection-methods.md
          - "05 — Как IDS/IPS обнаруживает подозрительную активность": course/05-detection-methods.md
          - "06 — Что такое правила и как они устроены": course/06-rules.md
      - Материалы предыдущей редакции:
          - "Оценка качества обнаружения — предыдущая редакция": course/06-detection-quality.md
          - "07 — предыдущая редакция, будет заменена": course/07-placement.md
          - "08 — предыдущая редакция, будет заменена": course/08-detection-engineering.md
  - Лабораторные работы:
      - "00 — Подготовка лабораторной среды": labs/environment/index.md
      - ЛР №1 — Первый NIDS: labs/lab01/index.md
      - ЛР №2 — Один эпизод, два источника данных: labs/lab02/index.md
      - ЛР №3 — Точка наблюдения: labs/lab03/index.md
      - ЛР №4 — Разные основания обнаружения: labs/lab04/index.md
      - ЛР №5 — Первое собственное правило Suricata: labs/lab05/index.md
  - Проверка знаний:
      - Предварительная проверка знаний №1 (предыдущая редакция): prelab/index.md
  - Материалы:
      - Источники курса: resources/sources.md
      - Реестр источников и проверок: resources/evidence-register.md
      - Аудит источников и точности: resources/audit-report.md
      - Глоссарий: resources/glossary.md
      - Визуальные элементы: resources/visual-guide.md
      - Диагностика проблем: resources/troubleshooting.md
